<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>4주차 - 실습</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body>
        class="w-screen h-screen flex justify-center items-center bg-neutral-900"
    >
        <section
            class="p-10 text-white w-3/4 flex flex-col items-center justify-center bg-cyan-900/30 border border-cyan-900/70 rounded-xl gap-4 shadow-lg"
        >
            <img class="size-14 bg-cyan-400 rounded-full" />
            <div class="flex flex-col text-center gap-2">
                <h1 class="font-semibold">축하합니다! 🎉</h1>
                <p class="text-xs text-gray-400">
                    Tailwind CSS 튜토리얼을 모두 완료했습니다. 이제 배운 내용을
                    실제 프로젝트에 적용해 보세요!
                </p>
            </div>
            <nav class="flex flex-col sm:flex-row justify-center gap-4">
                <button
                    class="shadow-sm transition-all active:scale-95 hover:bg-cyan-500 bg-cyan-400 px-4 py-2 rounded-xl text-neutral-800 text-xs font-semibold ease-in-out"
                >
                    홈으로 돌아가기
                </button>
                <button
                    class="shadow-sm transition-all ease-in-out active:scale-95 hover:bg-neutral-700 bg-neutral-800 px-4 py-2 rounded-xl text-xs font-semibold"
                >
                    처음부터 복습하기
                </button>
            </nav>
        </section>
    </body>
</html>
